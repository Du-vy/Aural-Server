# Builds the Aural server for every supported platform/architecture, builds and
# publishes the multi-architecture Docker image, and creates the GitHub Release
# with all standalone archives and checksums.
#
# Manual only, on purpose. This is the production pipeline: it tags the repo,
# publishes containers to GHCR, and puts binaries in front of people. It runs
# when somebody decides a release is happening, never because a commit landed.
#
#   Actions -> Release -> Run workflow
#
# The version comes from the repo, not from an input: bump it in
# internal/buildinfo/buildinfo.go, commit, then run this. The tag is derived from
# that version, so a tag can never name something other than what the binaries
# and container images actually report.

name: Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "How to leave the release when builds finish"
        type: choice
        default: draft
        options:
          - draft       # created, visible only to maintainers until published by hand
          - prerelease  # public, flagged as a prerelease
          - published   # public, marked as the latest release
      dry_run:
        description: "Build only - attach archives to this workflow run, create no tag, release or public image"
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # 1. Checks: Lint, test, and version resolution
  # ---------------------------------------------------------------------------
  checks:
    name: Checks
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify formatting (gofmt)
        run: |
          diffs=$(gofmt -l .)
          if [ -n "$diffs" ]; then
            echo "The following files are not formatted with gofmt:"
            echo "$diffs"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run tests with race detector
        run: go test -race ./...

      - name: Resolve version from buildinfo
        id: version
        run: node .github/scripts/resolve-version.mjs >> "$GITHUB_OUTPUT"

      - name: Refuse a tag that already exists
        if: ${{ !inputs.dry_run }}
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::$TAG is already tagged. Bump the version in internal/buildinfo/buildinfo.go and commit before releasing."
            exit 1
          fi
          echo "$TAG is available."

  # ---------------------------------------------------------------------------
  # 2. Build binaries matrix across all supported OS and architectures.
  # Compiles statically and packages into .tar.gz / .zip archives.
  # ---------------------------------------------------------------------------
  build-binaries:
    name: Build ${{ matrix.target.name }}
    needs: checks
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: linux-amd64
            goos: linux
            goarch: amd64
            ext: ""
            format: tar.gz
          - name: linux-arm64
            goos: linux
            goarch: arm64
            ext: ""
            format: tar.gz
          - name: linux-armv7
            goos: linux
            goarch: arm
            goarm: "7"
            ext: ""
            format: tar.gz
          - name: windows-amd64
            goos: windows
            goarch: amd64
            ext: ".exe"
            format: zip
          - name: windows-arm64
            goos: windows
            goarch: arm64
            ext: ".exe"
            format: zip
          - name: darwin-arm64
            goos: darwin
            goarch: arm64
            ext: ""
            format: tar.gz
          - name: darwin-amd64
            goos: darwin
            goarch: amd64
            ext: ""
            format: tar.gz
          - name: freebsd-amd64
            goos: freebsd
            goarch: amd64
            ext: ""
            format: tar.gz
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Install zip tool (if needed)
        if: matrix.target.format == 'zip'
        run: sudo apt-get update && sudo apt-get install -y zip

      - name: Build static binary
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
          GOARM: ${{ matrix.target.goarm || '' }}
          VERSION: ${{ needs.checks.outputs.version }}
        run: |
          mkdir -p dist/staging
          BINARY_NAME="aural-server${{ matrix.target.ext }}"
          go build -trimpath \
            -ldflags="-s -w -X github.com/aural-chat/aural-server/internal/buildinfo.Version=${VERSION}" \
            -o "dist/staging/${BINARY_NAME}" ./cmd/aural-server

      - name: Package archive
        id: pack
        env:
          VERSION: ${{ needs.checks.outputs.version }}
          TARGET_NAME: ${{ matrix.target.name }}
          FORMAT: ${{ matrix.target.format }}
        run: |
          cp config.example.json dist/staging/
          cp README.md dist/staging/
          cp LICENSE dist/staging/
          # A Windows convenience script has no business in a tarball for
          # Linux, macOS or FreeBSD.
          if [ "$FORMAT" = "zip" ] && [ -f run.bat ]; then
            cp run.bat dist/staging/
          fi

          ARCHIVE_NAME="aural-server-${VERSION}-${TARGET_NAME}.${FORMAT}"
          cd dist/staging
          if [ "$FORMAT" = "tar.gz" ]; then
            tar -czf "../${ARCHIVE_NAME}" *
          else
            zip -r "../${ARCHIVE_NAME}" *
          fi
          cd ../..

          echo "archive_path=dist/${ARCHIVE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Save archive as artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.target.name }}
          path: ${{ steps.pack.outputs.archive_path }}
          retention-days: 7

  # ---------------------------------------------------------------------------
  # 3. Build & Publish multi-architecture Docker image to GHCR
  # ---------------------------------------------------------------------------
  build-docker:
    name: Build & Publish Docker Image
    needs: checks
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.checks.outputs.version }}
            type=raw,value=latest,enable=${{ inputs.release_type == 'published' }}
            type=semver,pattern={{version}},value=${{ needs.checks.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.checks.outputs.version }}
            type=semver,pattern={{major}},value=${{ needs.checks.outputs.version }}

      - name: Build and push multi-arch Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: ${{ !inputs.dry_run }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.checks.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # 4. Publish Release: Downloads all archives, calculates checksums, and creates
  # the release in one atomic step (no API race conditions or tag lookup failures).
  #
  # The archives and the container image are separate deliverables, so this waits
  # for the image but does not require it. A plain `needs` on build-docker meant
  # a QEMU hiccup on one of three platforms silently skipped this job, and a
  # skipped job is grey in the UI, not red: the release simply never appeared and
  # nothing said why. The archives are what this job publishes; if they built,
  # they ship, and the notes below drop the container section instead.
  # ---------------------------------------------------------------------------
  publish-release:
    name: Publish Release
    needs: [checks, build-binaries, build-docker]
    if: >-
      ${{ !cancelled()
      && needs.checks.result == 'success'
      && needs.build-binaries.result == 'success' }}
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all packages
        uses: actions/download-artifact@v4
        with:
          pattern: package-*
          merge-multiple: true
          path: dist/packages

      - name: Generate SHA-256 checksums
        run: |
          cd dist/packages
          sha256sum aural-server-* > checksums.txt
          cat checksums.txt

      - name: Prepare release notes
        env:
          VERSION: ${{ needs.checks.outputs.version }}
          DOCKER_RESULT: ${{ needs.build-docker.result }}
        run: |
          REPO_OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          cat <<EOF > release_notes.md
          Self-hosted server for Aural ${VERSION}.

          ### Traditional Standalone Binaries

          Download the package matching your OS and architecture. Each archive contains the static \`aural-server\` binary, documentation, and \`config.example.json\`.

          | Platform | Architecture | Archive |
          | --- | --- | --- |
          | Linux | x86_64 (amd64) | \`aural-server-${VERSION}-linux-amd64.tar.gz\` |
          | Linux | ARM64 (aarch64 / Raspberry Pi 4+) | \`aural-server-${VERSION}-linux-arm64.tar.gz\` |
          | Linux | ARMv7 (32-bit / Raspberry Pi 2/3) | \`aural-server-${VERSION}-linux-armv7.tar.gz\` |
          | Windows | x86_64 (amd64) | \`aural-server-${VERSION}-windows-amd64.zip\` |
          | Windows | ARM64 | \`aural-server-${VERSION}-windows-arm64.zip\` |
          | macOS | Apple Silicon (M-series) | \`aural-server-${VERSION}-darwin-arm64.tar.gz\` |
          | macOS | Intel (x86_64) | \`aural-server-${VERSION}-darwin-amd64.tar.gz\` |
          | FreeBSD | x86_64 (amd64) | \`aural-server-${VERSION}-freebsd-amd64.tar.gz\` |

          Verify file integrity with \`checksums.txt\` (SHA-256).
          EOF

          # Only advertise the image when it actually reached the registry.
          if [ "$DOCKER_RESULT" = "success" ]; then
            cat <<EOF >> release_notes.md

          ### Docker Container

          Multi-architecture image (\`linux/amd64\`, \`linux/arm64\`, \`linux/arm/v7\`):
          \`\`\`sh
          docker pull ghcr.io/${REPO_OWNER}/aural-server:${VERSION}
          \`\`\`

          Quick start with Docker Compose:
          \`\`\`sh
          curl -O https://raw.githubusercontent.com/Du-vy/Aural-Server/main/docker-compose.yml
          docker compose up -d
          docker compose logs -f
          \`\`\`
          EOF
          else
            echo "::warning::The container image did not publish (build-docker: $DOCKER_RESULT). The release ships the archives only, and its notes omit the Docker section."
          fi

      - name: Create GitHub Release with all assets
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.checks.outputs.tag }}
          VERSION: ${{ needs.checks.outputs.version }}
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          FLAGS=""
          if [ "$RELEASE_TYPE" = "draft" ]; then
            FLAGS="--draft"
          elif [ "$RELEASE_TYPE" = "prerelease" ]; then
            FLAGS="--prerelease"
          else
            FLAGS="--latest"
          fi

          echo "Creating release $TAG with flags: $FLAGS"
          gh release create "$TAG" dist/packages/* \
            --repo "${{ github.repository }}" \
            --target "${{ github.sha }}" \
            --title "Aural Server ${VERSION}" \
            --notes-file release_notes.md \
            $FLAGS

      - name: Attach all assets to workflow run (dry run)
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: release-bundle
          path: dist/packages/*
          retention-days: 14
