# Builds the Aural server for every supported platform/architecture, builds and
# publishes the multi-architecture Docker image, and attaches standalone archives
# to a GitHub release.
#
# Manual only, on purpose. This is the production pipeline: it tags the repo,
# publishes containers to GHCR, and puts binaries in front of people. It runs
# when somebody decides a release is happening, never because a commit landed.
#
#   Actions -> Release -> Run workflow
#
# The version comes from the repo, not from an input: bump it in
# internal/buildinfo/buildinfo.go, commit, then run this. The tag is derived from
# that version, so a tag can never name something other than what the binaries
# and container images actually report.

name: Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "How to leave the release when builds finish"
        type: choice
        default: draft
        options:
          - draft       # created, visible only to maintainers until published by hand
          - prerelease  # public, flagged as a prerelease
          - published   # public, marked as the latest release
      dry_run:
        description: "Build only - attach archives to this workflow run, create no tag, release or public image"
        type: boolean
        default: false

permissions:
  contents: write
  packages: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # ---------------------------------------------------------------------------
  # Nothing is built, tagged, or published until checks pass.
  # ---------------------------------------------------------------------------
  checks:
    name: Checks
    runs-on: ubuntu-22.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify formatting (gofmt)
        run: |
          diffs=$(gofmt -l .)
          if [ -n "$diffs" ]; then
            echo "The following files are not formatted with gofmt:"
            echo "$diffs"
            exit 1
          fi

      - name: Run go vet
        run: go vet ./...

      - name: Run tests with race detector
        run: go test -race ./...

      - name: Resolve version from buildinfo
        id: version
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: node .github/scripts/resolve-version.mjs >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # The release is created up front as a draft. Standalone binaries and Docker
  # builds have a concrete release to upload to, and nothing is public until
  # `finalise` decides what to do with it.
  # ---------------------------------------------------------------------------
  prepare:
    name: Prepare release
    needs: checks
    runs-on: ubuntu-22.04
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Refuse a tag that already exists
        if: ${{ !inputs.dry_run }}
        env:
          TAG: ${{ needs.checks.outputs.tag }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::$TAG is already tagged. Bump the version in internal/buildinfo/buildinfo.go and commit before releasing."
            exit 1
          fi
          echo "$TAG is free."

      - name: Create draft release
        id: create
        if: ${{ !inputs.dry_run }}
        uses: actions/github-script@v7
        env:
          TAG: ${{ needs.checks.outputs.tag }}
          VERSION: ${{ needs.checks.outputs.version }}
        with:
          script: |
            const { TAG, VERSION } = process.env;
            const repoOwner = context.repo.owner.toLowerCase();
            const { data } = await github.rest.repos.createRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag_name: TAG,
              target_commitish: context.sha,
              name: `Aural Server ${VERSION}`,
              body: [
                `Self-hosted server for Aural ${VERSION}.`,
                "",
                "### Traditional Standalone Binaries",
                "",
                "Download the archive for your operating system and architecture. Each archive contains the static `aural-server` executable, documentation, and `config.example.json`.",
                "",
                "| OS | Architecture | Package |",
                "| --- | --- | --- |",
                `| Linux | x86_64 (amd64) | \`aural-server-${VERSION}-linux-amd64.tar.gz\` |`,
                `| Linux | ARM64 (aarch64 / Raspberry Pi 4+) | \`aural-server-${VERSION}-linux-arm64.tar.gz\` |`,
                `| Linux | ARMv7 (32-bit / Raspberry Pi 2/3) | \`aural-server-${VERSION}-linux-armv7.tar.gz\` |`,
                `| Windows | x86_64 (amd64) | \`aural-server-${VERSION}-windows-amd64.zip\` |`,
                `| Windows | ARM64 | \`aural-server-${VERSION}-windows-arm64.zip\` |`,
                `| macOS | Apple Silicon (M-series) | \`aural-server-${VERSION}-darwin-arm64.tar.gz\` |`,
                `| macOS | Intel (x86_64) | \`aural-server-${VERSION}-darwin-amd64.tar.gz\` |`,
                `| FreeBSD | x86_64 (amd64) | \`aural-server-${VERSION}-freebsd-amd64.tar.gz\` |`,
                "",
                "Verify file integrity using `checksums.txt` (SHA-256).",
                "",
                "### Docker Container",
                "",
                "Multi-architecture container image (`linux/amd64`, `linux/arm64`, `linux/arm/v7`):",
                "```sh",
                `docker pull ghcr.io/${repoOwner}/aural-server:${VERSION}`,
                "```",
                "Or run directly with Docker Compose:",
                "```sh",
                "curl -O https://raw.githubusercontent.com/Du-vy/Aural-Server/main/docker-compose.yml",
                "docker compose up -d",
                "docker compose logs -f",
                "```",
              ].join("\n"),
              draft: true,
              generate_release_notes: true,
            });
            core.setOutput("release_id", data.id);
            core.notice(`Draft release ready: ${data.html_url}`);

  # ---------------------------------------------------------------------------
  # Traditional standalone binary matrix compilation.
  # Pure Go with no cgo compiles cleanly and deterministically for all targets.
  # ---------------------------------------------------------------------------
  build-binaries:
    name: Build ${{ matrix.target.name }}
    needs: [checks, prepare]
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: linux-amd64
            goos: linux
            goarch: amd64
            ext: ""
            format: tar.gz
          - name: linux-arm64
            goos: linux
            goarch: arm64
            ext: ""
            format: tar.gz
          - name: linux-armv7
            goos: linux
            goarch: arm
            goarm: "7"
            ext: ""
            format: tar.gz
          - name: windows-amd64
            goos: windows
            goarch: amd64
            ext: ".exe"
            format: zip
          - name: windows-arm64
            goos: windows
            goarch: arm64
            ext: ".exe"
            format: zip
          - name: darwin-arm64
            goos: darwin
            goarch: arm64
            ext: ""
            format: tar.gz
          - name: darwin-amd64
            goos: darwin
            goarch: amd64
            ext: ""
            format: tar.gz
          - name: freebsd-amd64
            goos: freebsd
            goarch: amd64
            ext: ""
            format: tar.gz
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Build static binary
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.target.goos }}
          GOARCH: ${{ matrix.target.goarch }}
          GOARM: ${{ matrix.target.goarm || '' }}
          VERSION: ${{ needs.checks.outputs.version }}
        run: |
          mkdir -p dist/staging
          BINARY_NAME="aural-server${{ matrix.target.ext }}"
          go build -trimpath \
            -ldflags="-s -w -X github.com/aural-chat/aural-server/internal/buildinfo.Version=${VERSION}" \
            -o "dist/staging/${BINARY_NAME}" ./cmd/aural-server

      - name: Package archive
        id: pack
        env:
          VERSION: ${{ needs.checks.outputs.version }}
          TARGET_NAME: ${{ matrix.target.name }}
          FORMAT: ${{ matrix.target.format }}
        run: |
          # Copy accompanying files
          cp config.example.json dist/staging/
          cp README.md dist/staging/
          cp LICENSE dist/staging/
          if [ -f run.bat ]; then
            cp run.bat dist/staging/
          fi

          ARCHIVE_NAME="aural-server-${VERSION}-${TARGET_NAME}.${FORMAT}"
          cd dist/staging
          if [ "$FORMAT" = "tar.gz" ]; then
            tar -czf "../${ARCHIVE_NAME}" *
          else
            zip -r "../${ARCHIVE_NAME}" *
          fi
          cd ../..

          echo "archive_name=${ARCHIVE_NAME}" >> "$GITHUB_OUTPUT"
          echo "archive_path=dist/${ARCHIVE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Upload to draft release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.checks.outputs.tag }}
          ARCHIVE_PATH: ${{ steps.pack.outputs.archive_path }}
        run: |
          gh release upload "$TAG" "$ARCHIVE_PATH" --repo "${{ github.repository }}"

      - name: Save archive as artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target.name }}
          path: ${{ steps.pack.outputs.archive_path }}
          retention-days: 7

  # ---------------------------------------------------------------------------
  # Collects all binary archives and calculates SHA-256 checksums.
  # ---------------------------------------------------------------------------
  checksums:
    name: Checksums
    needs: [checks, prepare, build-binaries]
    runs-on: ubuntu-22.04
    steps:
      - name: Download all binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true
          path: dist/checksums

      - name: Generate SHA-256 checksums
        run: |
          cd dist/checksums
          sha256sum aural-server-* > checksums.txt
          cat checksums.txt

      - name: Upload checksums to draft release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.checks.outputs.tag }}
        run: |
          gh release upload "$TAG" dist/checksums/checksums.txt --repo "${{ github.repository }}"

      - name: Attach checksums to workflow run
        uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: dist/checksums/checksums.txt
          retention-days: 14

  # ---------------------------------------------------------------------------
  # Builds and pushes multi-architecture Docker image to GHCR (and Docker Hub).
  # Supports linux/amd64, linux/arm64, linux/arm/v7.
  # ---------------------------------------------------------------------------
  build-docker:
    name: Build & Publish Docker Image
    needs: [checks, prepare]
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: ${{ !inputs.dry_run }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub (optional)
        if: ${{ !inputs.dry_run && secrets.DOCKERHUB_USERNAME != '' && secrets.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ghcr.io/${{ github.repository }}
            ${{ secrets.DOCKERHUB_USERNAME != '' && format('{0}/aural-server', secrets.DOCKERHUB_USERNAME) || '' }}
          tags: |
            type=raw,value=${{ needs.checks.outputs.version }}
            type=raw,value=latest,enable=${{ inputs.release_type == 'published' }}
            type=semver,pattern={{version}},value=${{ needs.checks.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=${{ needs.checks.outputs.version }}
            type=semver,pattern={{major}},value=${{ needs.checks.outputs.version }}

      - name: Build and push multi-arch Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: ${{ !inputs.dry_run }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.checks.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Finalise release: publishes or marks as prerelease if all builds succeeded.
  # ---------------------------------------------------------------------------
  finalise:
    name: Finalise release
    needs: [checks, prepare, build-binaries, checksums, build-docker]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-22.04
    steps:
      - name: Set release visibility
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
          RELEASE_TYPE: ${{ inputs.release_type }}
        with:
          script: |
            const { RELEASE_ID, RELEASE_TYPE } = process.env;
            const { data } = await github.rest.repos.updateRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: Number(RELEASE_ID),
              draft: RELEASE_TYPE === "draft",
              prerelease: RELEASE_TYPE === "prerelease",
              make_latest: RELEASE_TYPE === "published" ? "true" : "false",
            });
            core.notice(
              RELEASE_TYPE === "draft"
                ? `Draft ready to review and publish: ${data.html_url}`
                : `Released: ${data.html_url}`
            );

  # ---------------------------------------------------------------------------
  # Cleanup: Discard the draft release if any build job failed, preventing
  # half-completed releases from remaining in the repository.
  # ---------------------------------------------------------------------------
  cleanup:
    name: Discard failed release
    needs: [prepare, build-binaries, checksums, build-docker]
    if: ${{ always() && !inputs.dry_run && needs.prepare.result == 'success' && (needs.build-binaries.result != 'success' || needs.checksums.result != 'success' || needs.build-docker.result != 'success') }}
    runs-on: ubuntu-22.04
    steps:
      - name: Delete draft release
        uses: actions/github-script@v7
        env:
          RELEASE_ID: ${{ needs.prepare.outputs.release_id }}
        with:
          script: |
            await github.rest.repos.deleteRelease({
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: Number(process.env.RELEASE_ID),
            });
            core.warning("A build job failed, so the draft release was automatically discarded.");
